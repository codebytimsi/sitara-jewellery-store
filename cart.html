<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Cart | SITARA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="nav-container">

            <a href="index.html" class="logo">SITARA</a>

            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="index.html#collections">Collections</a>
                <a href="index.html#about">About</a>
            </nav>

            <div class="nav-actions">

                <button class="search-btn" aria-label="Search">
                    ⌕
                </button>

                <a href="cart.html" class="cart-link">
                    🛍
                    <span class="cart-count">0</span>
                </a>

                <button
                    class="menu-btn"
                    id="menuBtn"
                    aria-label="Open menu"
                    aria-expanded="false"
                >
                    ☰
                </button>

            </div>

        </div>
    </header>


    <!-- Cart -->
    <main class="cart-page">

        <div class="cart-header">
            <p class="section-label">YOUR SELECTION</p>
            <h1>Your Shopping Bag</h1>
        </div>

        <div class="cart-layout">

            <!-- Cart Items -->
            <section class="cart-items" id="cartItems">
                <!-- Cart products will appear here -->
            </section>


            <!-- Cart Summary -->
            <aside class="cart-summary">

                <h2>Order Summary</h2>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="cartSubtotal">₹0</span>
                </div>

                <div class="summary-row">
                    <span>Shipping</span>
                    <span>Free</span>
                </div>

                <div class="summary-divider"></div>

                <div class="summary-total">
                    <span>Total</span>
                    <span id="cartTotal">₹0</span>
                </div>

                <button class="primary-btn checkout-btn">
                    Proceed to Checkout
                </button>

                <a href="shop.html" class="continue-shopping">
                    ← Continue Shopping
                </a>

            </aside>

        </div>

    </main>


    <!-- Footer -->
    <footer>
        <div class="footer-content">

            <div class="footer-brand">
                <h2>SITARA</h2>
                <p>Jewellery that tells your story.</p>
            </div>

            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="index.html#collections">Collections</a>
                <a href="index.html#about">About</a>
            </div>

        </div>

        <p class="footer-bottom">
            © 2026 Timsi Thukral. Built with curiosity & code. ✦
        </p>
    </footer>


    <!-- JavaScript -->
    <script src="js/script.js"></script>
    <script src="js/cart.js"></script>

</body>
</html>
